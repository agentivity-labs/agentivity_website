<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d"><title id="t">What a shared agent saves on the AI bill</title><desc id="d">Usage bill saved on one task, by the number of people who share it: 10 people, between 15% and 43%; 20, between 29% and 55%; 50, between 36% and 61%; 500 people, between 39% and 63%. Middle of our estimate. Estimate from public prices and simple assumptions, not a measurement.</desc><rect width="960" height="560" fill="#fff"/><text x="24" y="48" font-size="30" font-weight="700" fill="#14284B" font-family="'Segoe UI', Helvetica, Arial, sans-serif">What a shared agent saves on the AI bill</text><text x="24" y="80" font-size="18" fill="#6B7487" font-family="'Segoe UI', Helvetica, Arial, sans-serif">Usage bill saved on one task, by the number of people who share it</text><line x1="70" x2="936" y1="470.0" y2="470.0" stroke="#D9DEE8" stroke-width="2"/><text x="60" y="475.0" text-anchor="end" font-size="15" fill="#6B7487" font-family="'Segoe UI', Helvetica, Arial, sans-serif">0%</text><line x1="70" x2="936" y1="378.6" y2="378.6" stroke="#D9DEE8" stroke-width="1"/><text x="60" y="383.6" text-anchor="end" font-size="15" fill="#6B7487" font-family="'Segoe UI', Helvetica, Arial, sans-serif">20%</text><line x1="70" x2="936" y1="287.1" y2="287.1" stroke="#D9DEE8" stroke-width="1"/><text x="60" y="292.1" text-anchor="end" font-size="15" fill="#6B7487" font-family="'Segoe UI', Helvetica, Arial, sans-serif">40%</text><line x1="70" x2="936" y1="195.7" y2="195.7" stroke="#D9DEE8" stroke-width="1"/><text x="60" y="200.7" text-anchor="end" font-size="15" fill="#6B7487" font-family="'Segoe UI', Helvetica, Arial, sans-serif">60%</text><rect x="118.2" y="401.4" width="120" height="68.6" fill="#14284B"/><rect x="118.2" y="273.4" width="120" height="128.0" rx="6" fill="#8FB0EE"/><rect x="118.2" y="400.4" width="120" height="2" fill="#fff"/><text x="178.2" y="259.4" text-anchor="middle" font-size="19" font-weight="700" fill="#14284B" font-family="'Segoe UI', Helvetica, Arial, sans-serif">Between 15% and 43%</text><text x="178.2" y="499.0" text-anchor="middle" font-size="17" font-weight="600" fill="#3E4A5E" font-family="'Segoe UI', Helvetica, Arial, sans-serif">10 people</text><rect x="334.8" y="337.4" width="120" height="132.6" fill="#14284B"/><rect x="334.8" y="218.6" width="120" height="118.9" rx="6" fill="#8FB0EE"/><rect x="334.8" y="336.4" width="120" height="2" fill="#fff"/><text x="394.8" y="204.6" text-anchor="middle" font-size="19" font-weight="700" fill="#14284B" font-family="'Segoe UI', Helvetica, Arial, sans-serif">Between 29% and 55%</text><text x="394.8" y="499.0" text-anchor="middle" font-size="17" font-weight="600" fill="#3E4A5E" font-family="'Segoe UI', Helvetica, Arial, sans-serif">20</text><rect x="551.2" y="305.4" width="120" height="164.6" fill="#14284B"/><rect x="551.2" y="191.1" width="120" height="114.3" rx="6" fill="#8FB0EE"/><rect x="551.2" y="304.4" width="120" height="2" fill="#fff"/><text x="611.2" y="177.1" text-anchor="middle" font-size="19" font-weight="700" fill="#14284B" font-family="'Segoe UI', Helvetica, Arial, sans-serif">Between 36% and 61%</text><text x="611.2" y="499.0" text-anchor="middle" font-size="17" font-weight="600" fill="#3E4A5E" font-family="'Segoe UI', Helvetica, Arial, sans-serif">50</text><rect x="767.8" y="291.7" width="120" height="178.3" fill="#14284B"/><rect x="767.8" y="182.0" width="120" height="109.7" rx="6" fill="#8FB0EE"/><rect x="767.8" y="290.7" width="120" height="2" fill="#fff"/><text x="827.8" y="168.0" text-anchor="middle" font-size="19" font-weight="700" fill="#14284B" font-family="'Segoe UI', Helvetica, Arial, sans-serif">Between 39% and 63%</text><text x="827.8" y="499.0" text-anchor="middle" font-size="17" font-weight="600" fill="#3E4A5E" font-family="'Segoe UI', Helvetica, Arial, sans-serif">500 people</text><text x="24" y="540" font-size="14" font-style="italic" fill="#6B7487" font-family="