<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" role="img" aria-labelledby="t d"><title id="t">What a shared agent saves on the AI bill</title><desc id="d">Usage bill saved on one task, by the number of people who share it: 10 people, between 15% and 43%; 20, between 29% and 55%; 50, between 36% and 61%; 500 people, between 39% and 63%. Middle of our estimate. Estimate from public prices and simple assumptions, not a measurement.</desc><rect width="480" height="600" fill="#fff"/><text x="20" y="40" font-size="25" font-weight="700" fill="#14284B" font-family="'Segoe UI', Helvetica, Arial, sans-serif">What a shared agent</text><text x="20" y="70" font-size="25" font-weight="700" fill="#14284B" font-family="'Segoe UI', Helvetica, Arial, sans-serif">saves on the AI bill</text><text x="20" y="100" font-size="16" fill="#6B7487" font-family="'Segoe UI', Helvetica, Arial, sans-serif">Usage bill saved on one task,</text><text x="20" y="121" font-size="16" fill="#6B7487" font-family="'Segoe UI', Helvetica, Arial, sans-serif">by the number of people who share it</text><text x="20" y="170" font-size="16" font-weight="600" fill="#3E4A5E" font-family="'Segoe UI', Helvetica, Arial, sans-serif">10 people</text><text x="460" y="170" text-anchor="end" font-size="18" font-weight="700" fill="#14284B" font-family="'Segoe UI', Helvetica, Arial, sans-serif">Between 15% and 43%</text><rect x="20" y="184" width="94.3" height="40" fill="#14284B"/><rect x="114.3" y="184" width="176.0" height="40" rx="6" fill="#8FB0EE"/><rect x="113.3" y="184" width="2" height="40" fill="#fff"/><text x="20" y="270" font-size="16" font-weight="600" fill="#3E4A5E" font-family="'Segoe UI', Helvetica, Arial, sans-serif">20 people</text><text x="460" y="270" text-anchor="end" font-size="18" font-weight="700" fill="#14284B" font-family="'Segoe UI', Helvetica, Arial, sans-serif">Between 29% and 55%</text><rect x="20" y="284" width="182.3" height="40" fill="#14284B"/><rect x="202.3" y="284" width="163.4" height="40" rx="6" fill="#8FB0EE"/><rect x="201.3" y="284" width="2" height="40" fill="#fff"/><text x="20" y="370" font-size="16" font-weight="600" fill="#3E4A5E" font-family="'Segoe UI', Helvetica, Arial, sans-serif">50 people</text><text x="460" y="370" text-anchor="end" font-size="18" font-weight="700" fill="#14284B" font-family="'Segoe UI', Helvetica, Arial, sans-serif">Between 36% and 61%</text><rect x="20" y="384" width="226.3" height="40" fill="#14284B"/><rect x="246.3" y="384" width="157.1" height="40" rx="6" fill="#8FB0EE"/><rect x="245.3" y="384" width="2" height="40" fill="#fff"/><text x="20" y="470" font-size="16" font-weight="600" fill="#3E4A5E" font-family="'Segoe UI', Helvetica, Arial, sans-serif">500 people</text><text x="460" y="470" text-anchor="end" font-size="18" font-weight="700" fill="#14284B" font-family="'Segoe UI', Helvetica, Arial, sans-serif">Between 39% and 63%</text><rect x="20" y="484" width="245.1" height="40" fill="#14284B"/><rect x="265.1" y="484" width="150.9" height="40" rx="6" fill="#8FB0EE"/><rect x="264.1" y="484" width="2" height="40" fill="#fff"/><text x="20" y="582" font-size="13" font-style="italic" fill="#6B7487" font-family="'Segoe UI', Helvetica, Arial, sans-serif">Middle of our estimate. Estimate, not a measurement.</text></svg>
