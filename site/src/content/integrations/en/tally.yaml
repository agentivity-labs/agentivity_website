app: Tally
title: 'Tally AI Agents: Act on Every Form Answer | Agentivity'
description: 'A Tally AI agent starts on each form submission, reads every answer under its question and does the work: reply, file, qualify, alert.'
h1: Tally
h1_accent: AI agents
lead: A Tally AI agent starts the moment someone submits your form. It gets each answer under its question's title, so it can qualify a lead, file a request or draft a reply without anyone copying the answers by hand.
does:
  title: What your agents do in Tally
  items:
  - title: Start on each submission
    body: 'Choose a form: each new submission starts an agent, a team or a workflow, with the answers under their questions.'
  - title: Read the answers
    body: It lists a form's submissions, all of them or since a date, and reads the form's questions to know what each answer means.
  - title: Clean up
    body: It deletes a submission for good, for example once the data is filed elsewhere.
example:
  title: One example
  body: A contact form that qualifies each request.
  steps:
  - 'Someone fills in your Tally contact form: the submission starts the workflow.'
  - 'An agent reads the answers and sorts the request: a sales lead, a support question or something else.'
  - A sales lead is added to your CRM; a support question goes to your support team.
  - The agent drafts a reply for the person who answered, for you to check.
  result: Each request lands in the right place, with a reply ready, as soon as it is sent.
connect:
  title: Connect Tally
  steps:
  - In Tally, open Settings, then API keys, and press Create API key.
  - Copy the key (it starts with tly-) and paste it in a new Tally connection, in Administration, Credentials.
  - For a trigger, choose the form whose submissions start the work.
  docs:
    label: How connections work
    href: /docs/guides/manage-credentials/
limits:
  title: Good to know
  items:
  - The key acts for you, with your access to your Tally workspaces.
  - It reads forms and their answers; it does not create or change forms.
  - Deleting a submission cannot be undone.
faq:
  title: Questions
  items:
  - q: Does it work with any Tally form?
    a: Yes, any form the key's account can open. Each answer is named by its question's title.
  - q: Can several forms start different work?
    a: Yes. Each trigger watches one form, and you can make one per form.
  - q: Does someone need to be online?
    a: No. The submission starts the work on its own; a person is asked only where you added an approval.
