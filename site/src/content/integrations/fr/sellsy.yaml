app: Sellsy
title: 'Agents IA Sellsy : devis, factures et clients | Agentivity'
description: Un agent IA Sellsy ajoute entreprises et contacts, prépare devis et factures avec leurs lignes, et change le statut d'un devis au fil de la vente.
h1: Sellsy
h1_accent: agents IA
lead: Un agent IA Sellsy transforme une demande en brouillon de devis dans Sellsy, avec ses lignes, pour que personne ne la ressaisisse. Il ajoute aussi l'entreprise et le contact, et prépare la facture d'une entreprise cliente.
does:
  title: Ce que vos agents font dans Sellsy
  items:
  - title: Entreprises et contacts
    body: Il trouve une entreprise par son nom ou son adresse e-mail, la lit, et ajoute une entreprise (un prospect, sauf indication contraire) ou un contact avec son poste.
  - title: Préparer des devis
    body: Il prépare un devis pour une entreprise avec ses lignes (« 2 x Journée de conseil @ 600 »), une taxe pour toutes ses lignes, sa date de validité et sa devise.
  - title: Suivre le devis
    body: 'Il change le statut d''un devis : envoyé, accepté, refusé ou annulé.'
  - title: Préparer des factures
    body: Il prépare une facture pour une entreprise cliente, avec ses lignes et son échéance, et lit devis et factures.
example:
  title: Un exemple
  body: D'une demande de devis à un brouillon dans Sellsy.
  steps:
  - 'Une demande de devis arrive par votre formulaire : le workflow démarre.'
  - Un agent la lit et trouve l'entreprise dans Sellsy, ou l'ajoute comme prospect, et ajoute le contact.
  - Il prépare le devis avec les lignes et les prix de votre table de tarifs.
  - Une personne vérifie le brouillon dans Sellsy et l'envoie.
  result: Le devis est prêt à vérifier dès l'arrivée de la demande, avec l'entreprise et le contact déjà dans Sellsy.
connect:
  title: Connecter Sellsy
  steps:
  - Dans Sellsy, ouvrez la page Développeur et créez un client API de type personnel, avec les droits nécessaires (entreprises, contacts, devis, factures).
  - Copiez son identifiant client et son secret dans une nouvelle connexion Sellsy, dans Administration, Credentials.
  docs:
    label: Comment fonctionnent les connexions
    href: /docs/guides/manage-credentials/
limits:
  title: Bon à savoir
  items:
  - Le client API agit en votre nom. Son jeton dure une heure, et Agentivity en redemande un quand il expire.
  - 'Marquer un devis comme envoyé change seulement son statut : Sellsy ne l''envoie pas par e-mail.'
  - Certaines actions dépendent de votre offre Sellsy et des droits du client API.
faq:
  title: Questions
  items:
  - q: Envoie-t-il le devis au client ?
    a: Non. Il prépare le devis et change son statut ; l'envoi reste à vous, dans Sellsy ou par e-mail.
  - q: D'où viennent les prix ?
    a: 'De ce que vous lui donnez : une table de tarifs dans Agentivity, la demande elle-même, ou vos instructions.'
  - q: Faut-il savoir coder ?
    a: Non. Vous construisez le workflow dans le Studio visuel, ou vous le décrivez à Winston, qui en fait une première version.
